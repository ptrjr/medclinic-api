name: Publish and deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: medclinic-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/medclinic-api

jobs:
  publish:
    name: publish image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Record image and deployment mode
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DEPLOY_ENABLED: ${{ vars.RENDER_DEPLOY_ENABLED }}
        run: |
          echo "Image: ${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "Bootstrap: image published; Render deployment disabled. Configure Render and set RENDER_DEPLOY_ENABLED=true to enable automatic deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: deploy Render
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ vars.RENDER_DEPLOY_ENABLED == 'true' }}
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
    steps:
      - name: Check deployment configuration
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is required to deploy production." >&2
            exit 1
          fi
      - name: Trigger immutable image deployment
        run: |
          encoded_image="$(node -p 'encodeURIComponent(process.argv[1])' "$IMAGE")"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            --request POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${encoded_image}"
